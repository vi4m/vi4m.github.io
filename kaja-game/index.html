<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow Rush</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101a20;color:#fff;font-family:Arial,sans-serif}.game{position:relative;width:min(960px,100vw);overflow:hidden;border-radius:22px;background:#dfeef1;box-shadow:0 26px 70px #0009}canvas{display:block;width:100%;aspect-ratio:16/9}.brand{position:absolute;top:20px;left:22px;text-shadow:0 2px 8px #0008}.brand small{letter-spacing:.18em;font-weight:800}.brand h1{font:42px Georgia,serif;margin:3px 0}.score{position:absolute;right:22px;top:20px;background:#15252ddd;border-radius:12px;padding:10px 15px;text-align:right}.score small{display:block}.score b{font-size:26px}.bar{display:flex;gap:16px;align-items:center;padding:12px 16px;background:#17262e}.bar button{border:0;border-radius:8px;background:#e87922;color:#fff;padding:11px 16px;font-weight:bold;cursor:pointer}.bar span{color:#d6e4e8}@media(max-width:600px){.game{border-radius:0}.brand h1{font-size:30px}}
</style></head><body><main class="game"><div class="brand"><small>ALPINE RUN</small><h1>Snow Rush</h1><small>↑ skok · ← → prędkość</small></div><div class="score"><small>WYNIK</small><b id="score">0</b></div><canvas id="c" width="960" height="540"></canvas><div class="bar"><button id="start">Nowy przejazd</button><span id="msg">Wciśnij spację, aby ruszyć</span></div></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),score=document.querySelector('#score'),msg=document.querySelector('#msg'),keys={};let p,rails,running=false;const rider=new Image();rider.src='snowboarder.png';
function reset(){p={x:120,y:292,vy:0,s:4.5,n:0};rails=[480,800,1120];running=true;score.textContent='0';msg.textContent='Jedź, skacz i grinduj!'}
document.querySelector('#start').onclick=reset;addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space'){e.preventDefault();if(!running)reset()}});addEventListener('keyup',e=>keys[e.code]=0);
function loop(){if(running){if((keys.ArrowUp||keys.KeyW)&&p.y>=292)p.vy=-11;if(keys.ArrowRight)p.s=Math.min(8,p.s+.04);if(keys.ArrowLeft)p.s=Math.max(2.5,p.s-.06);p.vy+=.55;p.y=Math.min(292,p.y+p.vy);if(p.y===292)p.vy=0;p.x+=p.s;rails=rails.map(r=>{if(r&&p.x>r-35&&p.x<r+115&&p.y+38>296){p.n+=500;score.textContent=p.n;msg.textContent='GRIND! +500';return 0}return r});if(p.x>1400){running=false;p.n+=1000;score.textContent=p.n;msg.textContent='Meta! Świetny przejazd'}}draw();requestAnimationFrame(loop)}
function draw(){const cam=Math.max(0,(p?.x||120)-190),g=x.createLinearGradient(0,0,0,540);g.addColorStop(0,'#62849d');g.addColorStop(1,'#edf5f5');x.fillStyle=g;x.fillRect(0,0,960,540);x.fillStyle='#718a98';x.beginPath();x.moveTo(0,250);x.lineTo(170,75);x.lineTo(340,250);x.lineTo(520,115);x.lineTo(700,250);x.lineTo(960,140);x.lineTo(960,330);x.lineTo(0,330);x.fill();x.fillStyle='#edf5f6';x.beginPath();x.moveTo(0,320);x.quadraticCurveTo(220,250,430,320);x.quadraticCurveTo(670,380,960,285);x.lineTo(960,540);x.lineTo(0,540);x.fill();rails?.forEach(r=>{if(r){const q=r-cam;x.fillStyle='#33434d';x.fillRect(q,296,130,16);x.fillStyle='#e4edef';x.fillRect(q+7,299,116,3)}});if(p){const q=p.x-cam;x.save();x.translate(q,p.y);x.rotate(Math.max(-.11,Math.min(.12,p.vy*.012)));if(rider.complete){x.beginPath();x.ellipse(8,-14,72,63,0,0,Math.PI*2);x.clip();x.drawImage(rider,60,0,1410,1024,-65,-80,160,135)}else{x.fillStyle='#ec7927';x.fillRect(-10,-18,30,38);x.fillStyle='#12212a';x.beginPath();x.arc(3,-36,15,0,7);x.fill()}x.strokeStyle='#102028';x.lineWidth=7;x.beginPath();x.moveTo(-30,42);x.quadraticCurveTo(20,50,70,41);x.stroke();x.restore()}}
loop();
</script></body></html>
